# ThreadArt Generator - Redis Configuration
# Production-optimized Redis configuration for caching and queues

# Basic Configuration
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication
# requirepass is set via command line in docker-compose.yml using environment variable

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
# RDB Snapshots
save 900 1     # Save if at least 1 key changed in 900 seconds
save 300 10    # Save if at least 10 keys changed in 300 seconds  
save 60 10000  # Save if at least 10000 keys changed in 60 seconds

# RDB Configuration
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - Disabled by default for performance, enable for durability
appendonly no
# appendfilename "appendonly.aof"
# appendfsync everysec
# no-appendfsync-on-rewrite no
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""  # Log to stdout for Docker logging

# Performance Tuning
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
# rename-command CONFIG "CONFIG_a8b9c0d1e2f3"  # Rename sensitive commands

# Slow Query Logging
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 128

# Client Configuration
maxclients 10000

# Memory Optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Network
tcp-nodelay yes
stop-writes-on-bgsave-error yes

# Modules (if needed)
# loadmodule /usr/lib/redis/modules/redisearch.so
# loadmodule /usr/lib/redis/modules/redisgraph.so

# Notifications for keyspace events (useful for cache invalidation)
notify-keyspace-events "Ex"  # Notify for expired and deleted keys

# Latency Monitoring
latency-monitor-threshold 100